<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Asistencia y Evaluaciones</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e3a5f">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="contenedor-app">
    <header>
      <h1>📋 UniControl</h1>
      <p>Asistencia y Evaluaciones</p>
    </header>

    <main id="app">
      <!-- Vista de Grupos -->
      <section id="vista-grupos" class="vista activa">
        <div class="acciones-centradas">
          <button id="btn-nuevo-grupo" class="primario">➕ Nuevo grupo</button>
        </div>
        <div id="lista-grupos" class="lista"></div>
      </section>

      <!-- Vista interna de un Grupo -->
      <section id="vista-grupo" class="vista">
        <div class="barra-superior">
          <button id="btn-volver-grupos" class="icono">← Volver</button>
          <h2 id="titulo-grupo"></h2>
        </div>

        <div class="tabs">
          <button class="tab activo" data-tab="evaluaciones">📊 Evaluaciones</button>
          <button class="tab" data-tab="asistencia">📅 Asistencia</button>
        </div>

        <!-- Panel Evaluaciones (tabla) -->
        <div id="panel-evaluaciones" class="panel activo">
          <div class="acciones-centradas">
            <button id="btn-agregar-alumno" class="primario">➕ Añadir alumno</button>
            <button id="btn-agregar-evaluacion" class="primario" style="margin-top:5px;">➕ Nueva evaluación</button>
          </div>
          <div class="tabla-contenedor">
            <table id="tabla-evaluaciones">
              <thead></thead>
              <tbody></tbody>
            </table>
          </div>
        </div>

        <!-- Panel Asistencia (tabla) -->
        <div id="panel-asistencia" class="panel">
          <div class="acciones-centradas">
            <button id="btn-registrar-asistencia" class="primario">➕ Registrar asistencia</button>
          </div>
          <div class="tabla-contenedor">
            <table id="tabla-asistencia">
              <thead></thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </section>

      <!-- Modal: Añadir/Editar alumno -->
      <div id="modal-alumno" class="modal oculto">
        <div class="modal-contenido">
          <h3 id="modal-titulo">Nuevo alumno</h3>
          <input type="text" id="input-nombre" placeholder="Nombre(s)" required>
          <input type="text" id="input-apellido" placeholder="Apellido(s)" required>
          <div class="modal-botones">
            <button id="btn-cancelar-modal">Cancelar</button>
            <button id="btn-guardar-alumno" class="primario">Guardar</button>
          </div>
        </div>
      </div>

      <!-- Modal: Crear/Editar grupo -->
      <div id="modal-grupo" class="modal oculto">
        <div class="modal-contenido">
          <h3 id="modal-titulo-grupo">Nuevo grupo</h3>
          <input type="text" id="input-editar-nombre" placeholder="Nombre del grupo" required>
          <input type="number" id="input-editar-anio" placeholder="Año" min="1" required>
          <input type="text" id="input-editar-facultad" placeholder="Facultad" required>
          <input type="text" id="input-editar-asignaturas" placeholder="Asignaturas (separadas por comas)">
          <div class="modal-botones">
            <button id="btn-cancelar-editar-grupo">Cancelar</button>
            <button id="btn-guardar-editar-grupo" class="primario">Guardar</button>
          </div>
        </div>
      </div>

      <!-- Modal: Evaluaciones de un alumno -->
      <div id="modal-evaluaciones" class="modal oculto">
        <div class="modal-contenido">
          <h3>Evaluaciones de <span id="nombre-alumno-eval"></span></h3>
          <div class="evaluaciones-lista" id="lista-evaluaciones"></div>
          <div class="nueva-evaluacion">
            <input type="text" id="input-nombre-eval" placeholder="Ej: Examen oral 1">
            <select id="select-asignatura" style="width:100%; padding:10px; margin-bottom:8px;">
              <option value="">Sin asignatura</option>
            </select>
            <input type="number" id="input-nota" min="2" max="5" step="1" placeholder="Nota (2-5)">
            <button id="btn-agregar-evaluacion" class="primario pequeño">➕</button>
          </div>
          <p>Promedio actual: <strong id="promedio-actual">-</strong></p>
          <div class="modal-botones">
            <button id="btn-cerrar-evaluaciones">Cerrar</button>
          </div>
        </div>
      </div>

      <!-- Modal: Nueva evaluación (global) -->
      <div id="modal-nueva-evaluacion" class="modal oculto">
        <div class="modal-contenido">
          <h3>Nueva evaluación para el grupo</h3>
          <input type="text" id="input-nombre-nueva-eval" placeholder="Nombre de la evaluación" required>
          <div class="modal-botones">
            <button id="btn-cancelar-nueva-eval">Cancelar</button>
            <button id="btn-guardar-nueva-eval" class="primario">Crear</button>
          </div>
        </div>
      </div>

      <!-- Modal: Registrar asistencia (fecha + checkboxes) -->
      <div id="modal-asistencia" class="modal oculto">
        <div class="modal-contenido">
          <h3>Registrar asistencia</h3>
          <div class="selector-fecha">
            <label for="fecha-asistencia">Fecha:</label>
            <input type="date" id="fecha-asistencia">
          </div>
          <div id="asistencia-lista" class="lista"></div>
          <div class="modal-botones">
            <button id="btn-cancelar-asistencia">Cancelar</button>
            <button id="btn-guardar-asistencia" class="primario">Guardar</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
